<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Autotest de ejercicios</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 24px; background: #fff; color: #222; }
    .ok { color: #2b8a00; } .bad { color: #c00; }
    pre { background: #f4f4f4; padding: 8px; white-space: pre-wrap; }
  </style>
</head>
<body>
  <h1>Autotest de ejercicios</h1>
  <p>Comprueba que cada solución pasa sus propios requisitos y que cada código "a corregir" realmente falla.</p>
  <div id="out">Ejecutando…</div>
  <script type="module">
    import { COURSES } from '../js/courses.js';
    import { runChecks, bracketProblem, sameToken, esc } from '../js/code.js';
    import { hintsFor } from '../js/hints.js';
    import { checkMission, planInfo } from '../js/plan.js';
    import { MEMOS } from '../js/content/poo-memo.js';
    import { annotate } from '../js/glossary.js';
    import { checkIdeas } from '../js/code.js';
    import { recordResults, dueSteps } from '../js/srs.js';

    const problems = [];
    let count = 0;
    for (const course of COURSES) {
      for (const level of course.levels) {
        for (const s of level.steps) {
          count++;
          const where = `${level.id} · ${level.title} · ${s.t} · ${(s.prompt || s.title || '').slice(0, 70)}`;
          if (['write', 'fix', 'line'].includes(s.t)) {
            if (!s.solution) { problems.push([where, 'sin solución']); continue; }
            const br = s.t !== 'line' && bracketProblem(s.solution);
            if (br) problems.push([where, 'solución desbalanceada: ' + br]);
            const failed = runChecks(s.solution, s.checks).filter((r) => !r.ok);
            if (failed.length) problems.push([where, 'la solución no pasa: ' + failed.map((f) => f.label).join(' | ')]);
            if (s.starter && runChecks(s.starter, s.checks).every((r) => r.ok)) problems.push([where, 'el código inicial ya pasa todos los requisitos']);
          }
          if (s.t === 'fill') {
            const blanks = [...s.code.matchAll(/\[\[(.+?)\]\]/g)];
            if (!blanks.length) problems.push([where, 'fill sin espacios']);
            blanks.forEach((b) => b[1].split('|').forEach((a) => { if (!sameToken(a, a) || !a.trim()) problems.push([where, 'respuesta vacía']); }));
          }
          if (s.t === 'output' && !s.answer) problems.push([where, 'output sin respuesta']);
          if (s.t === 'explain') {
            const got = checkIdeas(s.model, s.ideas);
            const need = s.min || s.ideas.length;
            if (got.filter((g) => g.ok).length < need) problems.push([where, 'la respuesta modelo no pasa: ' + got.filter((g) => !g.ok).map((g) => g.label).join(' | ')]);
            if (checkIdeas('no se, algo de java con clases y cosas varias', s.ideas).filter((g) => g.ok).length >= need) problems.push([where, 'acepta una respuesta vacía de contenido']);
          }
          if (s.t !== 'teoria') {
            try {
              const hs = hintsFor(s);
              if (hs.length < 2) problems.push([where, `solo ${hs.length} pista(s)`]);
              // A hint must never be the full solution.
              if (s.solution && hs.some((h) => h.html.includes(esc(s.solution)))) problems.push([where, 'una pista muestra la solución completa']);
            } catch (e) { problems.push([where, 'pistas fallan: ' + e.message]); }
          }
        }
      }
      for (const u of course.units) {
        const m = u.mision;
        if (!m) { if (u.inExam) problems.push([u.title, 'unidad de la prueba sin misión']); continue; }
        if (Array.isArray(m.expect)) {
          const sample = m.expect.map((e) => (e instanceof RegExp ? (e.source.includes('Guardado') ? 'Guardado: Ana' : 'Error: algo') : e)).join('\n');
          const err = checkMission(m, 'basura previa\n' + sample + '\nfin');
          if (err) problems.push([`misión ${u.title}`, 'la salida esperada no valida: ' + err]);
          if (!checkMission(m, 'nada que ver')) problems.push([`misión ${u.title}`, 'valida cualquier cosa']);
        }
      }
      const json = '[{"id":1,"nombre":"Ana","correo":"a@a.cl","edad":20},{"id":2,"nombre":"Luis","correo":"l@l.cl","edad":22}]';
      const jm = course.units.find((u) => u.mision && u.mision.expect === 'json');
      if (jm && checkMission(jm.mision, json)) problems.push(['misión JSON', 'no acepta un JSON válido']);
      if (!course.exam || course.exam.levels.length < 30) problems.push(['plan', 'la prueba no tiene niveles']);
      const info = planInfo(course, { levels: {}, missions: {} }, '2026-10-22');
      const planned = info.days.reduce((n, d) => n + d.items.filter((i) => i.type === 'level' || i.type === 'mision').length, 0);
      if (planned !== info.remaining) problems.push(['plan', `planifica ${planned} de ${info.remaining} pasos`]);
      if (course.material.some((m) => !m.levels.length || m.levels.some((l) => !l))) problems.push(['material', 'referencia a nivel inexistente']);
      const ids = new Set(course.levels.map((l) => l.id));
      Object.keys(MEMOS).forEach((k) => { if (!ids.has(k)) problems.push(['memo', `clave inexistente ${k}`]); });
      course.levels.forEach((l) => {
        if (l.unit.key && l.index > 0) return;
        const card = l.steps.find((s) => s.t === 'teoria');
        if (!card || !card.parts.some((p) => p && p.memo)) problems.push([l.id + ' · ' + l.title, 'nivel sin "Para recordar"']);
      });
      course.units.forEach((u) => { if (!u.links.length) problems.push([u.title, 'unidad sin recursos']); });
      // Spaced repetition: right → later, wrong → tomorrow, due list works.
      const sp = { levels: {} };
      const [a, b] = course.levels[0].steps.filter((x) => x.t !== 'teoria');
      recordResults(sp, [{ id: a.id, ok: true }, { id: b.id, ok: false }], '2026-10-22');
      recordResults(sp, [{ id: a.id, ok: true }], '2026-10-23');
      if (sp.srs[a.id].box !== 2 || sp.srs[a.id].due !== '2026-10-25' || sp.srs[b.id].due !== '2026-10-23' || sp.srs[b.id].wrong !== 1) problems.push(['srs', JSON.stringify(sp.srs)]);
      if (dueSteps(course, sp, '2026-10-23').map((x) => x.id).join() !== b.id) problems.push(['srs', 'dueSteps incorrecto']);
      if (course.levels.filter((l) => l.steps.some((x) => x.t === 'explain')).length < 15) problems.push(['explica', 'faltan ejercicios de explicación']);
      // The glossary must find terms in normal text and never inside code blocks.
      const probe = document.createElement('div');
      probe.innerHTML = '<p>El constructor de la clase usa this.</p><pre class="code">class constructor</pre>';
      const found = annotate(probe).map((g) => g.t);
      if (!found.includes('constructor') || !found.includes('clase') || probe.querySelector('pre .term')) problems.push(['glosario', 'anota mal: ' + found.join(',')]);
    }
    const out = document.getElementById('out');
    out.innerHTML = `<p>${count} pasos revisados en ${COURSES[0].levels.length} niveles.</p>` + (problems.length
      ? `<h2 class="bad">${problems.length} problemas</h2>` + problems.map(([w, m]) => `<pre class="bad">${esc(w)}\n→ ${esc(m)}</pre>`).join('')
      : '<h2 class="ok">✔ Todo OK</h2>');
    window.__selftest = { count, problems };
  </script>
</body>
</html>
